; Rev A EMG wearable bring-up firmware (ESP32-S3-MINI-1-N8 + ADS1298).
; Build and flash over the board's USB-C:  pio run -t upload
; Serial console:                          pio device monitor

[env:revA]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_MODE=1          ; native USB-Serial-JTAG (no USB-UART chip on the board)
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB-C serial
    -O2
build_unflags = -Os
monitor_speed = 115200
monitor_filters = direct
upload_speed = 921600
